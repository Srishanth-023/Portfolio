<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portfolio of Srishanth - AI & Data Science Student, Full-Stack Developer, and AI Enthusiast." />
    
    <!-- Preload Critical Model -->
    <link rel="preload" href="/src/assets/3d/island.glb" as="fetch" crossorigin="anonymous" />

    <style>
      /* Pure CSS Preloader */
      #initial-loader {
        position: fixed;
        top: 0; left: 0; width: 100vw; height: 100vh;
        background: #f1f5f9; /* slate-100 */
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .spinner {
        width: 50px; height: 50px;
        border: 4px solid rgba(59, 130, 246, 0.2); /* blue-500 opacity-20 */
        border-top: 4px solid #3b82f6; /* blue-500 */
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      .loader-text {
        margin-top: 20px;
        color: #334155; /* slate-700 */
        font-weight: 600;
        letter-spacing: 1px;
      }
    </style>
    <title>Srishanth | Portfolio</title>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader">
        <div class="spinner"></div>
        <div class="loader-text">SRISHANTH</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
