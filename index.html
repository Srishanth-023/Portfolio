<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portfolio of Srishanth - AI & Data Science Student, Full-Stack Developer, and AI Enthusiast." />
    
    <!-- Preload Critical Model -->
    <link rel="preload" href="/src/assets/3d/island.glb" as="fetch" crossorigin="anonymous" />

    <style>
      /* Creative CSS Preloader */
      #initial-loader {
        position: fixed;
        inset: 0;
        background: #0f172a; /* slate-900 */
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        font-family: system-ui, -apple-system, sans-serif;
        color: #f8fafc;
      }
      .loader-brand {
        font-size: 1.2rem;
        font-weight: 300;
        letter-spacing: 14px;
        margin-bottom: 2rem;
        margin-right: -14px; /* compensate for letter spacing */
        opacity: 0.9;
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .loader-track {
        width: 200px;
        height: 1px;
        background: rgba(255, 255, 255, 0.1);
        position: relative;
        overflow: hidden;
      }
      .loader-fill {
        position: absolute;
        top: 0; left: 0; height: 100%;
        width: 100%;
        background: #ffffff;
        transform-origin: left;
        animation: load-indeterminate 1.5s infinite ease-in-out;
      }
      @keyframes load-indeterminate {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
    </style>
    <title>Srishanth | Portfolio</title>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader">
        <div class="loader-brand">SRISHANTH</div>
        <div class="loader-track">
          <div class="loader-fill"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
