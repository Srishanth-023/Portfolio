<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portfolio of Srishanth - AI & Data Science Student, Full-Stack Developer, and AI Enthusiast." />
    
    <!-- Preload Critical Model -->
    <link rel="preload" href="/src/assets/3d/island.glb" as="fetch" crossorigin="anonymous" />

    <style>
      /* Non-blocking top progress bar */
      #initial-loader {
        position: fixed;
        top: 0; left: 0; right: 0;
        height: 3px;
        background: rgba(255, 255, 255, 0.1);
        z-index: 9999;
        pointer-events: none;
      }
      .loader-fill {
        height: 100%;
        width: 0%;
        background: #3b82f6; /* blue-500 */
        transition: width 0.3s ease-out;
      }
      .fade-out {
        opacity: 0;
        transition: opacity 0.8s ease-in-out;
      }
    </style>
    <title>Srishanth | Portfolio</title>
  </head>
  <body>
    <div id="initial-loader">
      <div class="loader-fill"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
